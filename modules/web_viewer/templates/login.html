<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to MeshCore Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-a: #0d1b2a;
            --bg-b: #1b263b;
            --accent: #e0a458;
            --card: rgba(255, 255, 255, 0.92);
            --text: #102033;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top left, rgba(224, 164, 88, 0.25), transparent 28%),
                radial-gradient(circle at bottom right, rgba(102, 155, 188, 0.22), transparent 24%),
                linear-gradient(135deg, var(--bg-a), var(--bg-b));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 1.5rem;
        }

        .login-shell {
            max-width: 920px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 1.5rem;
        }

        .welcome-panel,
        .form-panel {
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
        }

        .welcome-panel {
            padding: 2.25rem;
            background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.14);
            backdrop-filter: blur(8px);
        }

        .welcome-kicker {
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 0.78rem;
            color: #c5d6e8;
            margin-bottom: 0.75rem;
        }

        .welcome-panel h1 {
            font-size: clamp(2rem, 4vw, 3.25rem);
            line-height: 1.05;
            margin-bottom: 1rem;
        }

        .welcome-panel p {
            color: #d5dfeb;
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 34rem;
        }

        .welcome-list {
            margin-top: 1.5rem;
            display: grid;
            gap: 0.7rem;
        }

        .welcome-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.85rem 1rem;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            color: #f2f6fb;
        }

        .form-panel {
            background: var(--card);
            color: var(--text);
            padding: 2rem;
        }

        .form-panel h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .form-panel p {
            color: #4d5f73;
            margin-bottom: 1.5rem;
        }

        .form-control {
            border-radius: 14px;
            padding: 0.9rem 1rem;
            border: 1px solid #ccd6e0;
        }

        .btn-access {
            width: 100%;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            border: none;
            background: linear-gradient(135deg, #16324f, #24557f);
            color: white;
            font-weight: 600;
        }

        .status-note {
            margin-top: 1rem;
            font-size: 0.92rem;
            color: #66788b;
        }

        @media (max-width: 860px) {
            .login-shell {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <section class="welcome-panel">
            <div class="welcome-kicker">MeshCore Bot</div>
            <h1>Sign in</h1>
            <p>Enter the viewer password to continue, or the write password for administrative access.</p>
        </section>
        <section class="form-panel">
            <h2>Sign in</h2>
            {% if error_message %}
            <div class="alert alert-danger" role="alert">{{ error_message }}</div>
            {% endif %}
            <form method="post" action="/login">
                <input type="hidden" name="next" value="{{ next_url }}">
                <div class="mb-3">
                    <label class="form-label" for="password">Viewer or write password</label>
                    <input class="form-control" id="password" name="password" type="password" autofocus required>
                </div>
                <button class="btn-access" type="submit">Login</button>
            </form>
        </section>
    </div>
</body>
</html>
